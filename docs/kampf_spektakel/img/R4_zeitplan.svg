<text x="20" y="450" font-size="12.5" fill="#2a2118">Gegnerzug: Kontakt bei 320 ms, Vorbereitung 240 ms, Banner 200 ms früher. Krit: Standbild 150 ms, danach Zeitlupe 0,5 für 200 ms (Takt um etwa 350 ms dehnen).</text>
